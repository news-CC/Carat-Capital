name: Deploy the Circulation Desk

# Tests and deploys the readership counter in analytics/ to Cloudflare
# Workers whenever it changes on main (or by hand from the Actions tab).
# Until the Cloudflare secrets below exist, the job only runs the tests and
# says what is missing, so it never turns main red.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    token with "Workers Scripts: Edit" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID   from the Cloudflare dashboard sidebar
#   CIRCULATION_PASSWORD    optional; sets the dashboard password on each deploy

on:
  push:
    branches: [main]
    paths:
      - 'analytics/**'
      - '.github/workflows/circulation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circulation
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CIRCULATION_PASSWORD: ${{ secrets.CIRCULATION_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: analytics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check for Cloudflare credentials
        id: gate
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Circulation Desk not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply database migrations
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker
        if: steps.gate.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Set the dashboard password
        if: steps.gate.outputs.ready == 'true' && env.CIRCULATION_PASSWORD != ''
        run: printf '%s' "$CIRCULATION_PASSWORD" | npx wrangler secret put DASHBOARD_PASSWORD
